version: '3.8'

services:
  # PostgreSQLデータベース
  postgres:
    image: postgres:15-alpine
    container_name: orthodontic-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orthodontic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orthodontic123}
      POSTGRES_DB: ${POSTGRES_DB:-orthodontic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthodontic"]
      interval: 10s
      timeout: 5s
      retries: 5

  # バックエンドAPI
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: orthodontic-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orthodontic}:${POSTGRES_PASSWORD:-orthodontic123}@postgres:5432/${POSTGRES_DB:-orthodontic_db}
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/backend:/app
      - ./src/analysis:/app/analysis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 統合API
  integration:
    build:
      context: ./src/integration
      dockerfile: Dockerfile
    container_name: orthodontic-integration
    environment:
      BACKEND_URL: http://backend:8000
      PYTHONPATH: /app
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./src:/app
    command: uvicorn integration.api.integration_api:app --host 0.0.0.0 --port 8080 --reload

  # フロントエンドUI
  frontend:
    build:
      context: ./src/ui
      dockerfile: Dockerfile
    container_name: orthodontic-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
      REACT_APP_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - integration
    volumes:
      - ./src/ui:/app
      - /app/node_modules
    command: npm start

  # Nginx リバースプロキシ
  nginx:
    image: nginx:alpine
    container_name: orthodontic-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - integration
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: orthodontic-network